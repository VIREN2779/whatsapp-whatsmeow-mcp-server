version: "3.8"
services:
  whatsapp-bridge:
    build: ./whatsapp-bridge
    ports:
      - "8081:8080"
    volumes:
      - image-pdf-approve-reject-dashboard:/app/store
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "4000:4000"
    volumes:
      - image-pdf-approve-reject-dashboard:/app/store:ro
    environment:
      - BRIDGE_URL=http://whatsapp-bridge:8080
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped

volumes:
  image-pdf-approve-reject-dashboard: