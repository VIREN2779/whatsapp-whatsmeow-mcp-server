version: "3.8"
services:
  whatsapp-bridge:
    build: ./whatsapp-bridge
    ports:
      - "8081:8080"
    volumes:
      - bridge-store:/app/store
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "4000:4000"
    volumes:
      - bridge-store:/app/store:ro
      - dashboard-data:/app/data
      - 'G:/My Drive/OCR In - Ketul:/app/export'
    environment:
      - BRIDGE_URL=http://whatsapp-bridge:8080
      - STATUS_FILE=/app/data/status.json
      - RULES_FILE=/app/data/rules.json
      - MESSAGES_DB_PATH=/app/store/messages.db
      - EXPORT_ROOT=/app/export
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped

volumes:
  bridge-store:
  dashboard-data:
