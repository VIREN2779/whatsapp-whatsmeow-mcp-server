<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Approved Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d12;
            --surface: #12151d;
            --surface-2: #171b25;
            --border: #242a38;
            --text: #e7e9ee;
            --muted: #838da3;
            --faint: #4d5568;
            --accent: #7c9eff;
            --approve: #34d399;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(52, 211, 153, 0.06), transparent),
                radial-gradient(ellipse 700px 400px at 100% 0%, rgba(124, 158, 255, 0.05), transparent);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 48px 32px 80px;
            min-height: 100vh;
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 36px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: lightslategrey;
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .stats {
            display: flex;
            gap: 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .stats b {
            color: var(--text);
            font-weight: 600;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: underline;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            transition: gap 0.15s ease;
        }

        .back-link:hover {
            gap: 10px;
        }

        .group {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.4s ease forwards;
        }

        .group:nth-child(1) {
            animation-delay: 0.02s;
        }

        .group:nth-child(2) {
            animation-delay: 0.06s;
        }

        .group:nth-child(3) {
            animation-delay: 0.10s;
        }

        .group:nth-child(4) {
            animation-delay: 0.14s;
        }

        .group:nth-child(5) {
            animation-delay: 0.18s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--approve);
        }

        .group.unlinked .group-head {
            border-left-color: var(--faint);
        }

        .num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .group.unlinked .num {
            color: var(--muted);
            font-style: italic;
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: white;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 9px;
        }

        .row {
            padding: 13px 20px;
            border-top: 1px solid var(--border);
            transition: background 0.15s ease;
        }

        .row:hover {
            background: var(--surface-2);
        }

        .fname {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 560px) {
            body {
                padding: 32px 16px 60px;
            }

            .fname {
                font-size: 12px;
            }

            .row {
                padding: 12px 14px;
            }

            .group-head {
                padding: 12px 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .group {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <p class="eyebrow">Last 100</p>
                <h1>Approved Media</h1>
            </div>
            <div class="stats" id="stats"></div>
        </header>
        <a class="back-link" href="/index.html">← Back to Media</a>
        <div id="groups"></div>
    </div>

    <script>
        async function load() {
            const res = await fetch('/api/approved-media');
            const { data } = await res.json();
            renderStats(data.results);
            renderGroups(data.results);
        }

        function renderStats(groups) {
            const totalMedia = groups.reduce((sum, g) => sum + g.media.length, 0);
            const numbers = groups.filter(g => g.phone_number).length;
            document.getElementById('stats').innerHTML =
                `<span><b>${totalMedia}</b> approved</span><span><b>${numbers}</b> numbers</span>`;
        }

        function renderGroups(groups) {
            const container = document.getElementById('groups');
            container.innerHTML = '';

            if (!groups.length) {
                container.innerHTML = '<div class="empty">Queue is empty — nothing waiting on review.</div>';
                return;
            }

            groups.forEach(group => {
                const isUnlinked = !group.phone_number;
                const el = document.createElement('div');
                el.className = 'group' + (isUnlinked ? ' unlinked' : '');
                el.innerHTML = `
                    <div class="group-head">
                        <div class="group-number">
                        <span class="num">${isUnlinked ? 'No number linked' : group.phone_number}</span>
                    </div>
                    <span class="badge">${group.media.length}</span>
                    </div>
                    ${group.media.map(row => `
                        <div class="row">
                            <span class="fname">${row.filename}</span>
                        </div>
                    `).join('')}
                `;
                container.appendChild(el);
            });
        }

        load();
    </script>
</body>

</html>
