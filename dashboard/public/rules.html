<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d12;
            --surface: #12151d;
            --surface-2: #171b25;
            --border: #242a38;
            --text: #e7e9ee;
            --muted: #838da3;
            --faint: #4d5568;
            --accent: #7c9eff;
            --accent-dim: rgba(124, 158, 255, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 48px 32px 80px;
            min-height: 100vh;
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 36px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            font-weight: 700;
            margin: 0;
        }

        .stats {
            display: flex;
            gap: 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .stats b {
            color: var(--text);
            font-weight: 600;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: underline;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        th,
        td {
            text-align: left;
            padding: 12px 20px;
            font-size: 13px;
        }

        th {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--faint);
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-top: 1px solid var(--border);
        }

        td.phone {
            font-family: 'JetBrains Mono', monospace;
        }

        td.name {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }

        button {
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
        }

        button:hover {
            filter: brightness(1.15);
        }

        .rename-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            width: 100%;
        }

        .rename-add-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .rename-add-row button {
            font-size: 12px;
            padding: 6px 10px;
            background: var(--accent-dim);
            border-color: rgba(124, 158, 255, 0.35);
            color: var(--accent);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Rules</h1>
            </div>
            <div class="stats" id="stats"></div>
        </header>
        <a class="back-link" href="/index.html">← Back to Media</a>
        <div id="content"></div>
        <datalist id="names-list"></datalist>
    </div>

    <script>
        let namesCache = [];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function load() {
            const res = await fetch('/api/rules');
            const { data } = await res.json();
            namesCache = [...new Set(data.results.map(r => r.name))].sort();
            document.getElementById('names-list').innerHTML =
                namesCache.map(n => `<option value="${escapeHtml(n)}">`).join('');
            renderStats(data.results);
            render(data.results);
        }

        function renderStats(rows) {
            document.getElementById('stats').innerHTML =
                `<span><b>${rows.length}</b> numbers</span>`;
        }

        function render(rows) {
            const content = document.getElementById('content');

            if (!rows.length) {
                content.innerHTML = '<div class="empty">No rules yet — approve a number from the queue to create one.</div>';
                return;
            }

            content.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Mobile number</th>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rules-body"></tbody>
                </table>
            `;

            const tbody = document.getElementById('rules-body');
            rows.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="phone">${escapeHtml(r.phone_number)}</td>
                    <td class="name" data-cell="name">${escapeHtml(r.name)}</td>
                    <td><button data-role="change">Edit name</button></td>
                `;
                // .onclick (not addEventListener) so startRename's later reassignment
                // fully replaces this handler instead of both firing on the same click
                tr.querySelector('[data-role="change"]').onclick = () => startRename(tr, r);
                tbody.appendChild(tr);
            });
        }

        function startRename(tr, r) {
            const nameCell = tr.querySelector('[data-cell="name"]');
            nameCell.innerHTML = `
                <input class="rename-input" list="names-list" value="${escapeHtml(r.name)}">
                <div class="rename-add-row"></div>
            `;
            const changeBtn = tr.querySelector('[data-role="change"]');
            const input = nameCell.querySelector('input');
            const addRow = nameCell.querySelector('.rename-add-row');
            input.focus();
            changeBtn.textContent = 'Save';

            async function saveName(newName) {
                await fetch(`/api/rules/rename?phone_number=${encodeURIComponent(r.phone_number)}&name=${encodeURIComponent(newName)}`, { method: 'POST' });
                load();
            }

            function renderPrefixChoice() {
                const q = input.value.trim();
                const qLower = q.toLowerCase();
                addRow.innerHTML = '';

                const exactMatch = namesCache.some(n => n.toLowerCase() === qLower);
                const hasPrefix = /^(client|lead)\//i.test(q);

                if (!q || exactMatch || hasPrefix) {
                    // Empty, matches an existing rule name exactly, or already
                    // correctly formatted — normal Save button, no add-choice buttons
                    changeBtn.style.display = '';
                    return;
                }

                // Bare text like "cummins" that doesn't match anything existing —
                // hide Save, force a category choice instead
                changeBtn.style.display = 'none';

                const clientName = `client/${q}`;
                const leadName = `lead/${q}`;

                const clientBtn = document.createElement('button');
                clientBtn.textContent = `Save as ${clientName}`;
                clientBtn.onclick = () => saveName(clientName);
                addRow.appendChild(clientBtn);

                const leadBtn = document.createElement('button');
                leadBtn.textContent = `Save as ${leadName}`;
                leadBtn.onclick = () => saveName(leadName);
                addRow.appendChild(leadBtn);
            }

            input.addEventListener('input', renderPrefixChoice);
            renderPrefixChoice();

            changeBtn.onclick = () => {
                const newName = input.value.trim();
                if (!newName) return;
                saveName(newName);
            };
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && changeBtn.style.display !== 'none') changeBtn.onclick();
            });
        }

        (function init() {
            load();
        })();
    </script>
</body>

</html>
